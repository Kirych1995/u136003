openapi: 3.0.3
info:
  title: CKD Unit Extract API
  version: 1.0.0
  description: API передачи данных помещений из ЦКД в CRM

paths:
  /unit-extract:
    post:
      summary: Передача данных помещений
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitExtractMessage'
            example:
              messageId: "9c7a2f10-1234-4bcd-9999-123456789000"
              sourceSystem: "CKD"
              sentAt: "2026-03-01T12:00:00+03:00"
              dataType: "UNIT_EXTRACT"
              batchId: "UNIT_BATCH_001"
              batchNumber: 1
              batchTotal: 1
              object:
                objectId: "ППТ1-4_"
                cadastralNumber: "77:17:0120316:84160"
                name: "Многоквартирный дом"
              units:
                - unitType: "Помещение"
                  usageType: "Нежилое"
                  cadastralNumber: "77:17:0120316:84378"
                  roomNumber: "42"
                  floor: 1
                  area: 96.2
                  cadastralValue: 6150165.09
                  address:
                    readableAddress: "Российская Федерация, город Москва, вн.тер.г. муниципальный округ Коммунарка, квартал 160, дом 1В, корпус 2, помещение 42Н"
                    region: "Москва"
                    city: "муниципальный округ Коммунарка"
                  rights:
                    - rightType: "Собственность"
                      registrationNumber: "77:17:0120316:84378-77/060/2025-1"
                      registrationDate: "2025-12-25"
                      rightHolder:
                        name: "ООО \"СПЕЦИАЛИЗИРОВАННЫЙ ЗАСТРОЙЩИК \"А101\""
                        inn: "7751172550"
                        ogrn: "1197746656095"
                        counterpartyType: "Юридическое лицо"
                      documentBasis: "Разрешение на ввод объекта в эксплуатацию №77-17-012573-2025"
                  restrictions:
                    - type: "Ипотека"
                      registrationNumber: "77:17:0120316:84378-77/060/2025-9"
                      registrationDate: "2025-12-25"
                      startDate: "2024-04-17"
                      endDate: "2025-12-19"
                      contractor:
                        name: "АО \"Российский Сельскохозяйственный банк\""
                        inn: "7725114488"
                        ogrn: "1027700342890"
                        counterpartyType: "Юридическое лицо"

                - unitType: "Машино-место"
                  usageType: ""
                  cadastralNumber: "77:17:0130206:13780"
                  roomNumber: "130"
                  floor: -1
                  area: 13.3
                  cadastralValue: 417452.42
                  address:
                    readableAddress: "Российская Федерация, город Москва, вн.тер.г. муниципальный округ Коммунарка, пр-кт Куприна, д. 7, к. 2, м/м 130"
                    region: "Москва"
                  rights:
                    - rightType: "Собственность"
                      registrationNumber: "77:17:011230206:13780-77/060/2025-1"
                      registrationDate: "2025-05-20"
                      rightHolder:
                        name: "ООО СПЕЦИАЛИЗИРОВАННЫЙ ЗАСТРОЙЩИК "
                        inn: "7751114550"
                        ogrn: "1197744156095"
                        counterpartyType: "Юридическое лицо"
                  restrictions:
                    - type: "Ипотека"
                      registrationNumber: "77:17:011230206:13780-77/060/2025-9"
                      registrationDate: "2025-05-20"
                      startDate: "2024-04-17"
                      endDate: "2026-12-21"
                      contractor:
                        name: "АО \"Российский Сельскохозяйственный банк\""
                        inn: "7725117488"
                        ogrn: "1027702642890"
                        counterpartyType: "Юридическое лицо"

              extract:
                extractDate: "2025-12-22"

      responses:
        '200':
          description: Успешная обработка сообщения
          content:
            application/json:
              example:
                status: "SUCCESS"
                message: "Объект и помещения успешно обработаны"
                processedRooms: 2

        '400':
          description: Ошибка валидации входных данных
          content:
            application/json:
              example:
                errorCode: "VALIDATION_ERROR"
                message: "Поле rooms не может быть пустым"

        '404':
          description: Объект или помещение не найдено
          content:
            application/json:
              example:
                errorCode: "NOT_FOUND"
                message: "Объект или помещение не найдено"

        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              example:
                errorCode: "INTERNAL_ERROR"
                message: "Ошибка обработки данных"

components:
  schemas:

    UnitExtractMessage:
      type: object
      required:
        - messageId
        - sourceSystem
        - sentAt
        - units
      properties:
        messageId:
          type: string
        sourceSystem:
          type: string
        sentAt:
          type: string
          format: date-time
        dataType:
          type: string
        batchId:
          type: string
        batchNumber:
          type: integer
        batchTotal:
          type: integer

        object:
          $ref: '#/components/schemas/ObjectInfo'

        units:
          type: array
          items:
            $ref: '#/components/schemas/Unit'

        extract:
          $ref: '#/components/schemas/ExtractInfo'

    ObjectInfo:
      type: object
      properties:
        objectId:
          type: string
        cadastralNumber:
          type: string
        name:
          type: string

    Unit:
      type: object
      required:
        - cadastralNumber
        - unitType
        - roomNumber
      properties:
        unitType:
          type: string
          example: "Помещение"
        usageType:
          type: string
          enum: ["Жилое", "Нежилое"]
        cadastralNumber:
          type: string
        roomNumber:
          type: string
        floor:
          type: integer
        area:
          type: number
        cadastralValue:
          type: number

        address:
          $ref: '#/components/schemas/Address'

        rights:
          type: array
          items:
            $ref: '#/components/schemas/Right'

        restrictions:
          type: array
          items:
            $ref: '#/components/schemas/Restriction'

    Address:
      type: object
      required:
        - readableAddress
      properties:
        garId:
          type: string
          format: uuid
          nullable: true
        fiasId:
          type: string
          format: uuid
          nullable: true
        readableAddress:
          type: string
        city:
          type: string
        region:
          type: string
        regionType:
          type: string
        district:
          type: string
        districtType:
          type: string
        street:
          type: string
        streetType:
          type: string
        houseType:
          type: string
        houseNumber:
          type: string
        oktmo:
          type: string
        okato:
          type: string

    Right:
      type: object
      properties:
        rightType:
          type: string
        registrationNumber:
          type: string
        registrationDate:
          type: string
          format: date
        rightHolder:
          $ref: '#/components/schemas/RightHolder'
        documentBasis:
          type: string

    RightHolder:
      type: object
      properties:
        name:
          type: string
        inn:
          type: string
        ogrn:
          type: string
        counterpartyType:
          type: string

    Restriction:
      type: object
      properties:
        type:
          type: string
        registrationNumber:
          type: string
        registrationDate:
          type: string
          format: date
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        contractor:
          $ref: '#/components/schemas/RightHolder'

    ExtractInfo:
      type: object
      properties:
        extractDate:
          type: string
          format: date