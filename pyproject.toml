[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-parser"
version = "0.1.0"
description = "Pipeline for collecting analytics from YouTube channel Viktor Eliseev BUSINESS NAPROLOM"
authors = [{name = "Automation", email = "example@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "python-dateutil>=2.8",
    "gspread>=5.11",
    "google-auth>=2.23",
]

[project.optional-dependencies]
export = ["gspread>=5.11", "google-auth>=2.23"]

[project.scripts]
youtube-parser = "youtube_parser.cli:main"
