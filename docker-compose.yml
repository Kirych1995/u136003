services:
  postgres:
    image: postgres:16-alpine
    container_name: ckd-workshop
    environment:
      POSTGRES_DB: ckd
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d ckd"]
      interval: 5s
      retries: 5
