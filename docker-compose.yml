services:
  postgres:
    build: .
    container_name: ckd-workshop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d ckd"]
      interval: 5s
      retries: 5

  swagger:
    image: swaggerapi/swagger-ui
    container_name: ckd-swagger
    ports:
      - "8080:8080"
    volumes:
      - ./swagger/openapi.yaml:/usr/share/nginx/html/openapi.yaml
    environment:
      SWAGGER_JSON: /usr/share/nginx/html/openapi.yaml
      BASE_URL: /
